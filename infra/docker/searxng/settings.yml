use_default_settings:
  engines:
    keep_only:
      - google
      - duckduckgo
      - wikipedia
      - wikidata
      - currency
      - dictzone
      - lingva
      - stackexchange
      - github
      - arxiv
      - pypi
      - npm

server:
  secret_key: "change-me-on-deploy"
  limiter: false
  image_proxy: true
  method: "GET"

search:
  safe_search: 0
  formats:
    - html
    - json

general:
  debug: false
  instance_name: "AI Lab Search"

engines:
  - name: google
    weight: 2
  - name: duckduckgo
    weight: 2
