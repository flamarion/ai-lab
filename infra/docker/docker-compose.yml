services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-ui
      - llm-gateway
    restart: unless-stopped

  llm-gateway:
    build:
      context: ../../
      dockerfile: services/llm-gateway/Dockerfile
    expose:
      - "8000"
    env_file:
      - ../../.env
    environment:
      - PYTHONPATH=/app:/app/shared/python
      - DATABASE_URL=${DATABASE_URL:-postgresql://ailab:ailab_dev@192.168.1.202:5432/ailab}
    volumes:
      # MCP OAuth token cache — mcp-remote stores tokens here after
      # manual auth on the host. Survives container restarts.
      - ~/.mcp-auth:/root/.mcp-auth
    restart: unless-stopped

  web-ui:
    build:
      context: ../../apps/web-ui
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      - llm-gateway
    restart: unless-stopped

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    expose:
      - "8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:rw
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://192.168.1.201/search/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

volumes:
  searxng-data:
