upstream web_ui {
    server web-ui:3000;
}

upstream gateway {
    server llm-gateway:8000;
}

server {
    listen 80;
    server_name _;

    # Upload limit for document ingestion and large requests
    client_max_body_size 100m;

    # Next.js web UI — default route
    location / {
        proxy_pass http://web_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets and internal routes
    location /_next/ {
        proxy_pass http://web_ui;
        proxy_set_header Host $host;
    }

    # Gateway API — accessible at /api/
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 27B model: cold starts across 2 GPUs + 32k context generations
        # can take several minutes. Set very high timeouts.
        # Note: 0 means "no timeout" for read/send but may mean
        # "instant timeout" for connect in some nginx versions.
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;

        # Disable buffering for SSE streaming (/chat/stream)
        proxy_buffering off;
    }
}
