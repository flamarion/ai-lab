upstream chat_ui {
    server chat-ui:8501;
}

upstream gateway {
    server llm-gateway:8000;
}

server {
    listen 80;
    server_name _;

    # Chat UI — default route
    location / {
        proxy_pass http://chat_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit requires WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Streamlit health check endpoint
    location /_stcore/health {
        proxy_pass http://chat_ui/_stcore/health;
    }

    # Gateway API — accessible at /api/
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # File uploads can be large (PDFs)
        client_max_body_size 50m;
    }
}
