upstream web_ui {
    server web-ui:3000;
}

upstream gateway {
    server llm-gateway:8000;
}

server {
    listen 80;
    server_name _;

    # Upload limit for document ingestion
    client_max_body_size 50m;

    # Next.js web UI — default route
    location / {
        proxy_pass http://web_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets and internal routes
    location /_next/ {
        proxy_pass http://web_ui;
        proxy_set_header Host $host;
    }

    # Gateway API — accessible at /api/
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # LLM inference can be very slow — 27B model cold start (loading
        # across 2 GPUs) + long generations on 32k context. Disable timeout.
        proxy_read_timeout 0;
    }
}
