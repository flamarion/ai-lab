## Traefik static configuration
## docs: https://doc.traefik.io/traefik/

# ── API & Dashboard ──────────────────────────────────────────────────────────
api:
  dashboard: true
  insecure: true   # Dashboard accessible without auth on :8080; add auth for production

# ── Ping endpoint (used by healthcheck) ──────────────────────────────────────
ping: {}

# ── Entry Points ─────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# ── Providers ────────────────────────────────────────────────────────────────
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: ai-lab
  file:
    directory: /etc/traefik/dynamic
    watch: true

# ── Logging ──────────────────────────────────────────────────────────────────
log:
  level: INFO

accessLog: {}
